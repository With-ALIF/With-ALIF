name: "Update Profile README and Stats"

on:
  push:
    branches:
      - main
  schedule:
    # Runs every 2 hours to keep stats and graphs fresh
    - cron: "0 */2 * * *"
  workflow_dispatch:

# Minimum required permissions
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # - name: Generate Contribution Snake Animation
      #   uses: Platane/snk/svg-only@v3
      #   with:
      #     github_user_name: ${{ github.repository_owner }}
      #     outputs: |
      #       dist/github-contribution-grid-snake.svg
      #       dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Update Dynamic README Section
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-readme.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "alifbrur16@gmail.com"
          git config --local user.name "With-ALIF"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected. Preparing random commit message..."
            
            MESSAGES=(
              "Update Profile"
              "Refresh README"
              "Sync Profile"
              "Update Stats"
              "Refresh Stats"
              "Sync README"
              "Profile Updated"
              "Stats Refreshed"
              "README Synced"
              "Profile Refresh"
              "Refresh Profile"
              "Activity Synced"
              "Update Activity"
            )
            
            RANDOM_MSG="${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}"
            echo "Selected commit message: $RANDOM_MSG"

            git add -A
            git commit -m "$RANDOM_MSG"
            git push
            echo "Successfully updated and pushed changes!"
          else
            echo "No changes detected. Skipping commit and push."
          fi
